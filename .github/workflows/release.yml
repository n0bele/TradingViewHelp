name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          # 不同 tag 之间复用同一份缓存，避免每次从零编译整个依赖树
          shared-key: windows-release

      - name: Verify tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $manifest = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $crateVer = $manifest.Matches[0].Groups[1].Value
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          Write-Output "Cargo.toml = $crateVer, tag = $tagVer"
          if ($crateVer -ne $tagVer) {
            Write-Error "Tag ${{ github.ref_name }} does not match Cargo.toml version $crateVer"
            exit 1
          }

      - name: Build release
        run: cargo build --release --locked

      - name: Run tests
        run: cargo test --release --locked

      - name: Package
        shell: pwsh
        run: |
          $manifest = Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $ver = $manifest.Matches[0].Groups[1].Value
          $stage = "dist/tvhelper-v$ver-windows-x64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/tvhelper.exe $stage/
          Copy-Item README.md $stage/
          Compress-Archive -Path "$stage/*" -DestinationPath "dist/tvhelper-v$ver-windows-x64.zip" -Force
          # 同时单独留一份裸 exe，方便直接下载替换
          Copy-Item target/release/tvhelper.exe "dist/tvhelper-v$ver-windows-x64.exe"
          Get-ChildItem dist | ForEach-Object { Write-Output "$($_.Name)  $([math]::Round($_.Length/1MB, 2)) MB" }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/tvhelper-*-windows-x64.zip
            dist/tvhelper-*-windows-x64.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
