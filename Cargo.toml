[package]
name = "tvhelper"
version = "0.1.2"
edition = "2021"
description = "TVHelper - TradingView 多账号助手（本地补丁 + 独立配置目录 / local patches + per-account profiles）"

[[bin]]
name = "tvhelper"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
dirs = "5"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
tray-icon = "0.25"

[target.'cfg(target_os = "macos")'.dependencies]
tray-icon = "0.25"

# Linux 用纯 Rust 的 StatusNotifierItem 实现，避免依赖 GTK/libappindicator 开发包
[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", features = ["blocking"] }

[profile.release]
opt-level = 2
strip = true
